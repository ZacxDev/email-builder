<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Toil-Killer — S3 ship settings</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; max-width: 520px; background:#111; color:#eee; }
  label { display:block; margin: 12px 0 4px; font-weight:600; }
  input { width:100%; padding:8px; background:#1c1c1e; color:#eee; border:1px solid #444; border-radius:6px; }
  button { margin-top:16px; padding:8px 18px; border-radius:6px; border:0; background:#3b82f6; color:#fff; cursor:pointer; }
  #status { margin-top:12px; min-height:1.2em; }
  .hint { color:#999; font-size:12px; }
</style>
</head>
<body>
<h1>🚀 Ship to homelab S3</h1>
<label for="endpoint">Endpoint</label>
<input id="endpoint" value="https://toil-s3.zacx.dev" />
<label for="bucket">Bucket</label>
<input id="bucket" value="toil-killer-runs" />
<label for="accessKey">Access key</label>
<input id="accessKey" value="toil-killer-svc" autocomplete="off" />
<label for="secretKey">Secret key</label>
<input id="secretKey" type="password" autocomplete="off" placeholder="Secret" />
<button id="save">Save</button>
<button id="clear" style="background:#444">Clear secret</button>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
